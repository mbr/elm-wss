<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>Example App</title>
</head>
<body>
<div id="elm"></div>

<script src="../js/elm-websockets.js"></script>
<script src="app.js"></script>
<script>
var app = Elm.Main.init({
  flags: new URLSearchParams(window.location.search).get("url") || "ws://127.0.0.1:8765",
  node: document.getElementById('elm')
});
ElmWebsockets.initApp(app);
</script>
</body>
</html>
